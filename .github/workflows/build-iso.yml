name: Build FluidOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build

      - name: Build-Skript ausführen
        run: |
          chmod +x build.sh
          sudo ./build.sh

      - name: ISO-Datei als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: fluidos-iso
          path: |
            *.iso
            **/*.iso
